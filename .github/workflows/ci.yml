# ตรวจทุก PR ก่อน merge: ติดตั้งได้, migration/seed รันผ่าน, test ผ่าน
# ถ้าขึ้นกากบาทแดงใน PR ให้กดดู log ว่าพังขั้นไหน
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maison_de_relic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/maison_de_relic
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: Migrate
        run: npm run db:migrate
      - name: Seed
        run: npm run db:seed
      - name: Migrate ซ้ำต้องไม่พัง (ไฟล์ที่รันแล้วต้องถูกข้าม)
        run: npm run db:migrate
      - name: Test
        run: npm test

  # ตรวจว่า docker compose เปิดทั้งระบบได้จริง (แบบเดียวกับที่ทุกคนใช้บนเครื่อง)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: เปิดทั้งระบบ (db + api + web)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: API ตอบและต่อฐานข้อมูลได้
        run: curl -fsS http://localhost:3000/api/health | grep '"db":"ok"'

      - name: หน้าเว็บเปิดได้ (รวมลิงก์แบบไม่มี .html)
        run: |
          for p in / /search /detail /team /login /admin/products /admin/users /js/api.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5500$p")
            echo "$p -> $code"
            test "$code" = "200"
          done

      - name: CORS อนุญาตหน้าเว็บที่ localhost:5500
        run: |
          curl -fsS -D - -o /dev/null -H 'Origin: http://localhost:5500' http://localhost:3000/api/health \
            | grep -i 'access-control-allow-origin: http://localhost:5500'

      - name: test ในกล่อง api
        run: docker compose exec -T api npm test

      - name: db:reset ใช้ได้กับกล่อง db
        run: docker compose exec -T api npm run db:reset

      - name: แสดง log เมื่อพัง
        if: failure()
        run: docker compose logs --no-color
