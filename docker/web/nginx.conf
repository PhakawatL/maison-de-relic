# เว็บเซิร์ฟเวอร์ของหน้าเว็บ (frontend/) ตอนรันด้วย docker compose
# ทำงานแบบเดียวกับ Vercel: เปิด /search ได้โดยไม่ต้องพิมพ์ .html
server {
  # ฟังเฉพาะ IPv4 ในกล่อง — ไม่ใส่ listen [::]:80 เพราะเครื่องที่ปิด IPv6 (เช่น WSL บางแบบ, Linux บางเครื่อง)
  # nginx จะเปิดไม่ขึ้นแล้วกล่อง web รีสตาร์ตวนไม่จบ ("Address family not supported by protocol")
  # เครื่องที่มี IPv6 ยังเปิด http://[::1]:5500 ได้ตามเดิม เพราะ Docker รับจากเครื่องแล้วส่งต่อเข้ากล่องทาง IPv4 ให้เอง
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ระหว่างพัฒนา: ไม่ให้เบราว์เซอร์จำไฟล์เก่า แก้ไฟล์แล้วกด refresh เห็นทันที
  add_header Cache-Control "no-store";

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # ไม่ให้เปิดไฟล์ตั้งค่าของ Vercel ผ่านเว็บ
  location = /vercel.json {
    return 404;
  }
}
