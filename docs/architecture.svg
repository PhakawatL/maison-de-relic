<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI','Thonburi',sans-serif">
  <title>สถาปัตยกรรมระบบ Maison de Relic</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .inner{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}
      .h{font-size:17px;font-weight:600;fill:#0f172a}
      .t{font-size:14px;fill:#334155}
      .s{font-size:12.5px;fill:#64748b}
      .m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;fill:#0f172a}
      .lbl{font-size:13px;fill:#334155}
      .sec{font-size:13px;font-weight:600;letter-spacing:.06em;fill:#64748b}
      .line{stroke:#475569;stroke-width:1.6;fill:none}
      .dash{stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:5 4;fill:none}
    </style>
  </defs>

  <rect width="1200" height="770" fill="#ffffff"/>

  <!-- ================= ส่วนที่ 1: ระหว่างใช้งาน ================= -->
  <text x="30" y="40" class="sec">1 · ระหว่างใช้งานจริง (เปิดเว็บ → เรียก API → ฐานข้อมูล)</text>

  <!-- Vercel -->
  <rect x="30" y="64" width="200" height="300" rx="10" class="box"/>
  <rect x="30" y="64" width="200" height="44" rx="10" fill="#f1f5f9"/>
  <rect x="30" y="98" width="200" height="10" fill="#f1f5f9"/>
  <text x="48" y="92" class="h">Vercel</text>
  <text x="48" y="134" class="m">frontend/</text>
  <text x="48" y="160" class="t">เก็บไฟล์หน้าเว็บ</text>
  <text x="48" y="182" class="s">HTML · CSS · JS</text>
  <text x="48" y="214" class="s">ไม่มีโค้ดฝั่ง server</text>
  <text x="48" y="234" class="s">แค่ส่งไฟล์ให้เบราว์เซอร์</text>

  <!-- Vercel -> Browser -->
  <line x1="230" y1="214" x2="296" y2="214" class="line" marker-end="url(#arr)"/>
  <text x="263" y="203" class="lbl" text-anchor="middle">ส่งไฟล์</text>

  <!-- Browser -->
  <rect x="300" y="64" width="250" height="300" rx="10" class="box"/>
  <rect x="300" y="64" width="250" height="44" rx="10" fill="#ecfdf5"/>
  <rect x="300" y="98" width="250" height="10" fill="#ecfdf5"/>
  <text x="318" y="92" class="h">เบราว์เซอร์ของผู้ใช้</text>
  <rect x="318" y="124" width="214" height="50" rx="6" class="inner"/>
  <text x="332" y="146" class="m">pages/search.js</text>
  <text x="332" y="164" class="s">โค้ดของแต่ละหน้า</text>
  <line x1="425" y1="174" x2="425" y2="196" class="line" marker-end="url(#arr)"/>
  <rect x="318" y="198" width="214" height="66" rx="6" class="inner"/>
  <text x="332" y="220" class="m">api.js</text>
  <text x="332" y="238" class="s">แนบ token · แปลง JSON</text>
  <text x="332" y="255" class="s">จัดการ error ที่เดียว</text>
  <text x="318" y="296" class="s">config.js เลือก URL ของ API</text>
  <text x="318" y="315" class="s">layout.js ทำ header/footer</text>

  <!-- Browser <-> API -->
  <line x1="550" y1="218" x2="626" y2="218" class="line" marker-end="url(#arr)"/>
  <text x="588" y="207" class="lbl" text-anchor="middle">fetch()</text>
  <line x1="626" y1="246" x2="552" y2="246" class="dash" marker-end="url(#arr)"/>
  <text x="588" y="268" class="s" text-anchor="middle">JSON</text>

  <!-- Railway API -->
  <rect x="630" y="64" width="330" height="300" rx="10" class="box"/>
  <rect x="630" y="64" width="330" height="44" rx="10" fill="#f5f3ff"/>
  <rect x="630" y="98" width="330" height="10" fill="#f5f3ff"/>
  <text x="648" y="92" class="h">Railway · API</text>
  <text x="840" y="92" class="m" text-anchor="start">backend/</text>

  <rect x="648" y="122" width="294" height="34" rx="6" class="inner"/>
  <text x="662" y="144" class="t">CORS</text>
  <text x="730" y="144" class="s">รับเฉพาะหน้าเว็บของเรา</text>

  <rect x="648" y="164" width="294" height="34" rx="6" class="inner"/>
  <text x="662" y="186" class="t">routes</text>
  <text x="730" y="186" class="s">URL ไหน → ฟังก์ชันไหน</text>

  <rect x="648" y="206" width="294" height="34" rx="6" class="inner"/>
  <text x="662" y="228" class="t">controller</text>
  <text x="750" y="228" class="s">รับ/ตรวจข้อมูล ตอบกลับ</text>

  <rect x="648" y="248" width="294" height="34" rx="6" class="inner"/>
  <text x="662" y="270" class="t">service</text>
  <text x="730" y="270" class="s">logic + SQL</text>

  <rect x="648" y="304" width="294" height="44" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="662" y="323" class="t">errorHandler</text>
  <text x="662" y="340" class="m">{ error: { code, message } }</text>

  <!-- API -> DB -->
  <line x1="942" y1="265" x2="1016" y2="265" class="line" marker-end="url(#arr)"/>
  <text x="979" y="254" class="lbl" text-anchor="middle">SQL</text>

  <!-- PostgreSQL -->
  <rect x="1020" y="64" width="150" height="300" rx="10" class="box"/>
  <rect x="1020" y="64" width="150" height="44" rx="10" fill="#eff6ff"/>
  <rect x="1020" y="98" width="150" height="10" fill="#eff6ff"/>
  <text x="1038" y="92" class="h">PostgreSQL</text>
  <text x="1038" y="134" class="t">บน Railway</text>
  <text x="1038" y="160" class="s">22 ตาราง</text>
  <text x="1038" y="190" class="s">สร้างจากไฟล์</text>
  <text x="1038" y="208" class="m">migrations/</text>

  <!-- ================= ส่วนที่ 2: ระหว่างพัฒนาและ deploy ================= -->
  <line x1="30" y1="408" x2="1170" y2="408" stroke="#e2e8f0"/>
  <text x="30" y="448" class="sec">2 · ระหว่างพัฒนา → ส่งโค้ด → ขึ้นเว็บจริงอัตโนมัติ</text>

  <!-- Laptop -->
  <rect x="30" y="472" width="280" height="200" rx="10" class="box"/>
  <rect x="30" y="472" width="280" height="44" rx="10" fill="#f1f5f9"/>
  <rect x="30" y="506" width="280" height="10" fill="#f1f5f9"/>
  <text x="48" y="500" class="h">เครื่องของสมาชิกแต่ละคน</text>
  <text x="48" y="544" class="m">docker compose up</text>
  <text x="48" y="568" class="t">3 กล่องใน Docker</text>
  <text x="48" y="590" class="s">web :5500 · api :3000 · db :5432</text>
  <text x="48" y="620" class="s">แต่ละคนมีฐานข้อมูลของตัวเอง</text>
  <text x="48" y="640" class="s">ทดลองพังก็ไม่กระทบเพื่อน</text>

  <!-- Laptop -> GitHub -->
  <line x1="310" y1="572" x2="386" y2="572" class="line" marker-end="url(#arr)"/>
  <text x="348" y="561" class="lbl" text-anchor="middle">push</text>
  <text x="348" y="592" class="s" text-anchor="middle">เปิด PR</text>

  <!-- GitHub -->
  <rect x="390" y="472" width="300" height="200" rx="10" class="box"/>
  <rect x="390" y="472" width="300" height="44" rx="10" fill="#f8fafc"/>
  <rect x="390" y="506" width="300" height="10" fill="#f8fafc"/>
  <text x="408" y="500" class="h">GitHub</text>
  <text x="408" y="544" class="t">CI ทดสอบอัตโนมัติ</text>
  <text x="408" y="564" class="s">สร้างฐานข้อมูลชั่วคราว → migrate → test</text>
  <text x="408" y="600" class="t">เพื่อนรีวิว + อนุมัติ</text>
  <text x="408" y="620" class="s">ผ่านทั้งสองอย่างจึง merge เข้า</text>
  <text x="408" y="640" class="m">main</text>

  <!-- GitHub -> Vercel / Railway -->
  <path d="M690 548 C 730 548, 730 520, 770 520" class="line" marker-end="url(#arr)"/>
  <path d="M690 600 C 730 600, 730 628, 770 628" class="line" marker-end="url(#arr)"/>
  <text x="728" y="580" class="s" text-anchor="middle">merge</text>

  <!-- Deploy targets -->
  <rect x="774" y="478" width="396" height="84" rx="10" class="box"/>
  <text x="792" y="506" class="h">Vercel</text>
  <text x="866" y="506" class="s">ถ้าไฟล์ใน frontend/ เปลี่ยน</text>
  <text x="792" y="534" class="t">deploy หน้าเว็บใหม่</text>
  <text x="792" y="552" class="s">+ ทุก PR ได้ลิงก์ preview ให้ลองก่อน</text>

  <rect x="774" y="586" width="396" height="84" rx="10" class="box"/>
  <text x="792" y="614" class="h">Railway</text>
  <text x="876" y="614" class="s">ถ้าไฟล์ใน backend/ เปลี่ยน</text>
  <text x="792" y="642" class="t">รัน migration → deploy API ใหม่</text>
  <text x="792" y="660" class="s">ตารางบนเว็บจริงอัปเดตตามไฟล์อัตโนมัติ</text>

  <!-- footer note -->
  <text x="30" y="740" class="s">frontend กับ backend รันแยกกันคนละเครื่อง และคุยกันผ่าน fetch() เท่านั้น · โครงงานวิชา ITDS241/242 มหาวิทยาลัยมหิดล</text>
</svg>
