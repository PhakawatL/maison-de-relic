# รันทั้งระบบบนเครื่องด้วยคำสั่งเดียว — 3 กล่องแยกกัน (หน้าเว็บกับ API แยกกันตามที่วิชากำหนด)
#
#   docker compose up --build     เปิดทั้งหมด (ครั้งแรก หรือหลัง package.json เปลี่ยน)
#   docker compose up             เปิดทั้งหมด (วันต่อ ๆ ไป)
#   docker compose down           ปิด (ข้อมูลในฐานข้อมูลยังอยู่)
#   docker compose down -v        ปิดและลบข้อมูลในฐานข้อมูลทิ้งทั้งหมด
#
#   หน้าเว็บ  http://localhost:5500
#   API       http://localhost:3000/api/health
#   ฐานข้อมูล localhost:5432 (user/pass: postgres/postgres) สำหรับเปิดดูด้วย DBeaver/TablePlus
#
# ถ้า port ไหนชนกับโปรแกรมอื่นในเครื่อง ตั้งค่าใหม่ได้ในไฟล์ .env ที่ root เช่น DB_PORT=5433

services:
  # ---------- ฐานข้อมูล ----------
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maison_de_relic
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maison_de_relic"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---------- API (Node.js) ----------
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      # ในเครือข่ายของ docker compose เรียกฐานข้อมูลด้วยชื่อกล่อง "db"
      DATABASE_URL: postgres://postgres:postgres@db:5432/maison_de_relic
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5500},http://127.0.0.1:${WEB_PORT:-5500}
      JWT_SECRET: dev-only-secret-change-me
    ports:
      - "${API_PORT:-3000}:3000"
    # เปิดเครื่องมาแล้ว: สร้าง/อัปเดตตาราง → ใส่ข้อมูลตัวอย่าง → เปิด API แบบรีสตาร์ตเองเมื่อแก้โค้ด
    command: sh -c "npm run db:migrate && npm run db:seed && node --watch src/server.js"
    volumes:
      # เชื่อมโฟลเดอร์บนเครื่องเข้าไปในกล่อง แก้โค้ดบนเครื่องแล้วกล่องเห็นทันที
      - ./backend:/app
      # แต่ node_modules ใช้ของในกล่อง (ไม่เอาของบนเครื่องมาทับ)
      - /app/node_modules
    healthcheck:
      # image แบบ slim ไม่มี wget/curl จึงใช้ node ยิงเช็กเอง
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # ---------- หน้าเว็บ ----------
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5500}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
