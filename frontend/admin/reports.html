<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ar.pageTitle">รายงานที่แจ้งเข้ามา · Maison de Relic</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages/admin.css">
  <link rel="stylesheet" href="/css/pages/admin-tickets.css">
  <!-- ตั้งธีม/ภาษาก่อนหน้าแสดงผล กันหน้ากระพริบ (แบบเดียวกับ admin/products.html) -->
  <script>
    (function (root) {
      var theme, lang;
      try { theme = localStorage.getItem('mdr_theme'); lang = localStorage.getItem('mdr_lang'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.dataset.theme = theme;
      if (lang === 'en') { root.lang = 'en'; root.classList.add('i18n-pending'); }
    })(document.documentElement);
  </script>
</head>
<body class="page-admin">
  <!-- รายงานที่แจ้งเข้ามา (S12 · BR-27–29) — เคสแจ้งปัญหาและรายงานสินค้าจากลูกค้า
       ต้องล็อกอินเป็นแอดมิน · ผู้รับผิดชอบ: R1 · wireframe 30-Admin-Reports
       ดู / ตอบ / เปลี่ยนสถานะ / มอบหมาย: แอดมินทุกคน · ลบเคส: เฉพาะ owner
       ข้อความทั้งหมดอยู่ใน js/locales/th.js และ en.js หมวด ar.* และ support.* -->
  <div id="admin-topbar"></div>

  <div class="container admin-shell">
    <nav id="admin-sidenav"></nav>

    <main class="admin-main view-enter">
      <div id="page-message" class="alert" role="status" hidden></div>

      <header class="page-head">
        <div>
          <p class="kicker" data-i18n="ar.kicker">แผงผู้ดูแล · บริการลูกค้า</p>
          <h1 class="page-title" data-i18n="ar.title">รายงานที่แจ้งเข้ามา</h1>
          <p class="page-lede" data-i18n="ar.lede">เคสแจ้งปัญหาและรายงานสินค้าจากลูกค้า ตอบกลับ เปลี่ยนสถานะ และมอบหมายผู้รับผิดชอบ</p>
        </div>
      </header>

      <!-- ตัวเลขแต่ละสถานะ (กดเพื่อกรอง) -->
      <div class="tk-counts" id="status-counts" role="group" aria-label="กรองตามสถานะ" data-i18n-attr="aria-label:ar.statusFilter"></div>

      <form id="search-form" class="admin-toolbar tk-toolbar" role="search">
        <label class="search-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="visually-hidden" data-i18n="ar.searchLabel">ค้นหาเคส</span>
          <input type="search" name="q" maxlength="100" autocomplete="off"
                 placeholder="ค้นหารหัสเคส / หัวข้อ / ผู้แจ้ง" data-i18n-attr="placeholder:ar.searchPlaceholder">
        </label>
        <label class="select-pill">
          <span class="visually-hidden" data-i18n="ar.categoryLabel">หมวดหมู่</span>
          <select name="category"></select>
        </label>
        <label class="select-pill">
          <span class="visually-hidden" data-i18n="ar.statusLabel">สถานะ</span>
          <select name="status"></select>
        </label>
        <label class="select-pill">
          <span class="visually-hidden" data-i18n="ar.assignedLabel">ผู้รับผิดชอบ</span>
          <select name="assigned"></select>
        </label>
        <button type="submit" class="btn btn-ghost btn-pill" data-i18n="ar.searchBtn">ค้นหา</button>
      </form>

      <div class="table-card">
        <div class="table-wrap">
          <table class="admin-table tk-table">
            <thead>
              <tr>
                <th scope="col" data-i18n="ar.col.code">รหัสเคส</th>
                <th scope="col" data-i18n="ar.col.subject">หัวข้อ</th>
                <th scope="col" data-i18n="ar.col.category">หมวดหมู่</th>
                <th scope="col" data-i18n="ar.col.reporter">ผู้แจ้ง</th>
                <th scope="col" data-i18n="ar.col.date">วันที่</th>
                <th scope="col" data-i18n="ar.col.status">สถานะ</th>
                <th scope="col" class="actions" data-i18n="ar.col.actions">จัดการ</th>
              </tr>
            </thead>
            <tbody id="ticket-rows"></tbody>
          </table>
        </div>
        <nav id="pager" class="pager"></nav>
      </div>
    </main>
  </div>

  <!-- รายละเอียดเคส + ตอบกลับ -->
  <dialog id="ticket-dialog" class="tk-dialog" aria-labelledby="tk-subject">
    <div id="ticket-detail"></div>
  </dialog>

  <!-- ยืนยันลบเคส (owner) -->
  <dialog id="delete-dialog" class="confirm-dialog" aria-labelledby="delete-title" aria-describedby="delete-desc">
    <span class="confirm-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
    </span>
    <h2 id="delete-title" data-i18n="ar.del.title">ลบเคสนี้?</h2>
    <p id="delete-desc"><strong id="delete-name"></strong><span data-i18n="ar.del.warn">ลบแล้วกู้คืนไม่ได้ (ประวัติการทำงานของผู้ดูแลยังเก็บไว้)</span></p>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost btn-pill" id="delete-cancel" data-i18n="ar.cancel">ยกเลิก</button>
      <button type="button" class="btn btn-danger" id="delete-confirm" data-i18n="ar.del.confirm">ลบเคส</button>
    </div>
  </dialog>

  <script type="module" src="/js/admin-layout.js"></script>
  <script type="module" src="/js/pages/admin-reports.js"></script>
</body>
</html>
