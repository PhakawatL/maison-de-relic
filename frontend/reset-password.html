<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="reset.pageTitle">ตั้งรหัสผ่านใหม่ · Maison de Relic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Bodoni+Moda:opsz,wght@6..96,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <!-- ตั้งรหัสผ่านใหม่จากลิงก์ในอีเมล (S1 · BR-02) · ผู้รับผิดชอบ: R2 -->
    <section class="card auth-card">
      <h1 data-i18n="reset.title">ตั้งรหัสผ่านใหม่</h1>
      <div id="done" class="alert alert-success" role="status" hidden></div>
      <div id="no-token" class="alert alert-error" role="alert" hidden>
        <span data-i18n="reset.noToken">ลิงก์ไม่ถูกต้อง กรุณากดลิงก์จากอีเมลอีกครั้ง หรือขอลิงก์ใหม่</span>
      </div>
      <form id="reset-form" novalidate>
        <div class="alert alert-error" data-form-alert role="alert" hidden></div>
        <div class="field">
          <label for="password" data-i18n="acct.newPassword">รหัสผ่านใหม่</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="100">
          <small class="muted" data-i18n="acct.passwordHint">อย่างน้อย 8 ตัวอักษร</small>
          <small class="field-error" data-error-for="password"></small>
        </div>
        <div class="field">
          <label for="password_confirm" data-i18n="acct.newPasswordConfirm">ยืนยันรหัสผ่านใหม่</label>
          <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required maxlength="100">
          <small class="field-error" data-error-for="password_confirm"></small>
        </div>
        <button class="btn btn-primary" type="submit" data-i18n="reset.submit">บันทึกรหัสผ่านใหม่</button>
      </form>
      <div class="auth-links">
        <a href="/login" data-i18n="reset.toLogin">ไปหน้าเข้าสู่ระบบ</a>
        <a href="/forgot-password" data-i18n="reset.requestNew">ขอลิงก์ใหม่</a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
