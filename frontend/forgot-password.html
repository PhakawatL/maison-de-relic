<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลืมรหัสผ่าน · Maison de Relic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <!-- ลืมรหัสผ่าน (S1 · BR-02): ส่งลิงก์ตั้งรหัสใหม่ไปทางอีเมล · ผู้รับผิดชอบ: R2 -->
    <section class="card auth-card">
      <h1>ลืมรหัสผ่าน</h1>
      <p class="muted">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้ (ใช้ได้ 30 นาที)</p>
      <div id="sent" class="alert alert-success" role="status" hidden></div>
      <form id="forgot-form" novalidate>
        <div class="alert alert-error" data-form-alert role="alert" hidden></div>
        <div class="field">
          <label for="email">อีเมล</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
          <small class="field-error" data-error-for="email"></small>
        </div>
        <button class="btn btn-primary" type="submit">ส่งลิงก์</button>
      </form>
      <div class="auth-links">
        <a href="/login">กลับไปหน้าเข้าสู่ระบบ</a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/pages/forgot-password.js"></script>
</body>
</html>
