<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบแอดมิน · Maison de Relic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <!-- หน้าบังคับ: Login Page — ฟอร์มให้แอดมินเข้าสู่ระบบด้วย Username/Password
         ผู้รับผิดชอบ: R2 -->
    <section class="card" style="max-width:420px;margin:0 auto">
      <h1>เข้าสู่ระบบแอดมิน</h1>
      <div id="login-error" class="alert alert-error" hidden></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">ชื่อผู้ใช้</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button>
      </form>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
